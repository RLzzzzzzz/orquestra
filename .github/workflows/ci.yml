name: CI Windows

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows / Node ${{ matrix.node }}
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Instalar dependências pelo lockfile
        run: npm.cmd ci --no-audit --no-fund
      - name: Verificações estáticas
        run: npm.cmd run check
      - name: Testes unitários com cobertura
        run: npm.cmd run test:unit -- --coverage
      - name: Build da interface
        run: npm.cmd run build
      - name: Integração HTTP, WebSocket, PTY e Git
        run: npm.cmd run test:integration -- --coverage
      - name: Regressão de orquestração e revisão
        run: npm.cmd run test:regression -- --coverage
      - name: Empacotar desktop sem publicar
        run: npm.cmd run desktop:pack -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Relatórios de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-windows-node-${{ matrix.node }}
          path: coverage/*.lcov
          if-no-files-found: warn
          retention-days: 14
